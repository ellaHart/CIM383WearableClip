# Template for settings.toml ON THE BOARD (D:\settings.toml). Edit it there directly.
# Never put real values in this file, and never commit settings.toml (it is in .gitignore).
# tools/deploy.ps1 never copies or overwrites the board's settings.toml.

# Phone hotspot (must be 2.4 GHz; on iPhone turn on "Maximize Compatibility").
# These are deliberately NOT the CIRCUITPY_WIFI_* names: those make CircuitPython
# connect on its own at boot and start its web file editor. wifi_link.py connects instead.
MOODCLIP_WIFI_SSID = "your-hotspot-name"
MOODCLIP_WIFI_PASSWORD = "your-hotspot-password"

# Website remote control (see docs/ARCHITECTURE.md). Leave out to keep the clip offline-only.
MOODCLIP_API_URL = "https://your-project.vercel.app"
MOODCLIP_DEVICE_TOKEN = "same value as DEVICE_TOKEN in the Vercel project's environment variables"
